<!DOCTYPE html>
<html>
<head>
    <title>Nebula FTP - Users</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; max-width: 800px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background-color: #f4f4f4; }
        a { text-decoration: none; color: blue; }
        .btn { display: inline-block; padding: 10px 15px; background: #007bff; color: white; border-radius: 4px; }
        .btn-danger { background: #dc3545; border: none; padding: 8px 12px; color: white; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Nebula FTP - User Management</h1>
    <a href="/add" class="btn">Add New User</a>
    <br><br>
    <table>
        <tr>
            <th>Login</th>
            <th>Permissions Count</th>
            <th>Actions</th>
        </tr>
        {% for user in users %}
        <tr>
            <td>{{ user.login }}</td>
            <td>{{ user.permissions | length }}</td>
            <td>
                <a href="/edit/{{ user.login }}" style="margin-right: 10px;">Edit</a>
                <form method="POST" action="/delete/{{ user.login }}" style="display:inline;" onsubmit="return confirm('Delete this user?');">
                    <button type="submit" class="btn-danger">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
