services:
  nebulaftp:
    build: .
    container_name: nebulaftp
    restart: unless-stopped
    env_file: .env
    environment:
      - DATA_DIR=/app/data
      - DB_FILE=/app/data/nebula.db
      - SFTP_HOST_KEY=/app/data/sftp_host_key
    ports:
      - "2222:2222"
      - "8082:8082"
    volumes:
      - ./data:/app/data
