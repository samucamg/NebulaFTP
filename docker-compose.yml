# As portas vêm do .env (SFTP_PORT e WEB_PORT). Sem elas, usa 2222 e 8082.
# Depois de mudar o .env: docker compose up -d --build
services:
  nebulaftp:
    build: .
    container_name: nebulaftp
    restart: unless-stopped
    env_file: .env
    environment:
      - HOST=0.0.0.0
      - DATA_DIR=/app/data
      - DB_FILE=/app/data/nebula.db
      - SFTP_HOST_KEY=/app/data/sftp_host_key
    ports:
      - "${SFTP_PORT:-2222}:${SFTP_PORT:-2222}"
      - "${WEB_PORT:-8082}:${WEB_PORT:-8082}"
    volumes:
      - ./data:/app/data
